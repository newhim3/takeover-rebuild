  function chain(){
    try{
      var h=H();if(!h)return false;
      if(h.__ccChained){apply();return true;}

      function saveSlot() { try { if (window.__takeoverSave) window.__takeoverSave(); } catch (e) {} }
      function freshStart() {
        // 删除/重置当前档后：强制整页重载让游戏以空档启动；
        // 若只在内存中保留旧档案，下次自动存档会把"已删除"的进度写回来（旧档复活）
        sessionStorage.setItem('__takeover_slot_entered', '1');
        var so = document.getElementById('switchOverlay');
        if (so) so.style.display = 'flex';
        var cur = new URLSearchParams(location.search).get('slot');
        if (cur === '1' || !cur) {
          location.reload();
        } else {
          window.location.href = location.pathname + '?slot=1' + (location.hash || '');
        }
      }
      function enterGame(target) {
        sessionStorage.setItem('__takeover_slot_entered', '1');
        if (target === curSlot) { hide(); return; }
        saveSlot(); // 切换槽位前先保存当前档，避免未保存进度在重载中丢失
        var url = location.pathname + '?slot=' + target;
        if (location.hash) url += location.hash;
        var so = document.getElementById('switchOverlay');
        if (so) so.style.display = 'flex'; // 先给过渡提示，避免直接黑屏
        window.location.href = url;
      }
      function pauseGame() { try { if (window.__takeoverPauseOn) window.__takeoverPauseOn(); } catch (e) {} }
      function resumeGame() { try { if (window.__takeoverPauseOff) window.__takeoverPauseOff(); } catch (e) {} }
      function hide() { resumeGame(); overlay.style.display = 'none'; }
      function show() {
        try {
          var clock = document.getElementById('slotClock');
          if (clock) clock.textContent = new Date().toLocaleString();
        } catch (e) {}
        render(); overlay.style.display = 'flex'; pauseGame();
      }
      // 暴露给游戏：开始屏幕的"存档"按钮点击时调用
      window.__showSaveOverlay = show;
      window.__hideSaveOverlay = hide;
      // 自定义删除确认框（替代原生 confirm）
      var confirmCb = null;
      function confirmDialog(msg, onYes) {
        var m = document.getElementById('confirmMsg');
        if (!m) { if (onYes) onYes(); return; }
        m.textContent = msg;
        confirmCb = onYes || null;
        document.getElementById('confirmOverlay').style.display = 'flex';
      }
      document.getElementById('confirmYes').onclick = function() {
        document.getElementById('confirmOverlay').style.display = 'none';
        var cb = confirmCb; confirmCb = null;
        if (cb) cb();
      };
      document.getElementById('confirmNo').onclick = function() {
        document.getElementById('confirmOverlay').style.display = 'none';
        confirmCb = null;
      };
      function delSlot(i) {
        confirmDialog('删除 存档' + (i + 1) + ' 的所有进度？此操作不可恢复！', function() {
          try { window.localStorage.removeItem(KEY(slotNames[i])); } catch (e) {}
          try { window.localStorage.removeItem(KEY(slotNames[i]) + '.meta'); } catch (e) {}
          try { window.localStorage.removeItem(KEY(slotNames[i]) + '.bak'); } catch (e) {}
          if (curSlot === i + 1) {
            freshStart(); // 删除当前档：强制重载以空档启动，防止旧档复活
          } else {
            render();
          }
        });
      }
      function render() {
        slotList.innerHTML = '';
        for (var i = 0; i < 3; i++) {
          var meta = getMeta(i);
          var isActive = (curSlot === i + 1);
          var card = document.createElement('div');
          card.className = 'slotCard' + (isActive ? ' active' : '');
          card.innerHTML =
            '<div class="slotNo">' + (i + 1) + '</div>' +
            '<div class="slotMain">' +
              '<div class="slotNameRow">' +
                '<span class="slotName">存档 ' + (i + 1) + '</span>' +
                (isActive ? '<span class="slotCur">当前</span>' : '') +
              '</div>' +
              '<div class="slotProg">' + progHTML(meta) + '</div>' +
            '</div>' +
            '<span class="slotChevron">›</span>' +
            '<button class="slotDel" title="删除此存档">✕</button>';
          var delBtn = card.querySelector('button');
          // 注意：必须用 IIFE 捕获 i（var 是函数作用域，直接引用会在循环结束后都指向 3）
          delBtn.onclick = (function(idx) { return function(ev) { ev.stopPropagation(); delSlot(idx); }; })(i);
          delBtn.addEventListener('touchstart', function(ev) { ev.stopPropagation(); }, { passive: false });
          card.onclick = (function(t) { return function() { enterGame(t); }; })(i + 1);
          slotList.appendChild(card);
        }
      }
      document.getElementById('btnCloseSlots').onclick = function() { sessionStorage.setItem('__takeover_slot_entered', '1'); hide(); };
      document.getElementById('btnResetAll').onclick = function() {
        confirmDialog('确定重置全部存档进度？此操作不可恢复！', function() {
          for (var i = 0; i < slotNames.length; i++) {
            try { window.localStorage.removeItem(KEY(slotNames[i])); } catch (e) {}
            try { window.localStorage.removeItem(KEY(slotNames[i]) + '.meta'); } catch (e) {}
            try { window.localStorage.removeItem(KEY(slotNames[i]) + '.bak'); } catch (e) {}
          }
          freshStart(); // 全部重置后强制重载，防止内存旧档复活
        });
      };
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.key === 'S') {
          e.preventDefault();
          if (overlay.style.display === 'none') show(); else hide();
        }
      });
      // 首次进入本标签页会话：显示存档选择；之后直接进游戏（通过开始屏幕的"存档"按钮）
      if (!sessionStorage.getItem('__takeover_slot_entered')) {
        setTimeout(function() { show(); }, 400);
      }
      // 友好错误提示：捕获未处理异常/加载失败，替代浏览器黑屏+Details
      var errOverlayEl = document.getElementById('errOverlay');
      function showErr(msg) {
        if (!errOverlayEl) return;
        var m = document.getElementById('errMsg');
        if (m) m.textContent = msg || '发生未知错误';
        errOverlayEl.style.display = 'flex';
      }
      document.getElementById('errReload').onclick = function() { location.reload(); };
      document.getElementById('errClose').onclick = function() {
        errOverlayEl.style.display = 'none';
        resumeGame(); // 若游戏已暂停则恢复
      };
      window.addEventListener('error', function(e) {
        if (e && e.error) showErr(e.message || (e.error && e.error.message));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e && e.reason;
        showErr(r && r.message ? r.message : String(r));
      });
    })();
  </script>

  <script>
    // 自动启动游戏引擎
    window.addEventListener('unhandledrejection', function(e) {
      window.__log.push('[REJECTION] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    function startGame() {
      try {
        if (window.lime && typeof window.lime.embed === 'function' && window.lime['$scripts'] && window.lime['$scripts']['takeover']) {
          window.__log.push('[START] lime ready, wrapping create with element config');
          // 包装 create 函数，传入 element 配置让 canvas 附加到 #app
          var origCreate = window.lime['$scripts']['takeover'];
          window.lime['$scripts']['takeover'] = function(F, E) {
            F = F || {};
            F.element = document.getElementById('app');
            F.width = window.innerWidth || 800;
            F.height = window.innerHeight || 600;
            window.__log.push('[CREATE] calling origCreate with element: ' + !!F.element + ' w:' + F.width + ' h:' + F.height);
            try {
              var result = origCreate(F, E);
              window.__log.push('[CREATE] origCreate returned: ' + typeof result);
              return result;
            } catch(ex) {
              window.__log.push('[CREATE ERROR] ' + ex.message + ' | stack: ' + (ex.stack||'').substring(0, 600));
              throw ex;
            }
          };
          window.__log.push('[START] calling lime.embed');
          var result = lime.embed('takeover');
          window.__log.push('[START] lime.embed returned, keys: ' + Object.keys(result).length);
          // 检查是否有 detached canvas，附加到 #app
          if (window.__canvasParent) {
            var cp = window.__canvasParent;
            var cpInDOM = document.body.contains(cp);
            window.__log.push('[ATTACH] canvasParent inDOM: ' + cpInDOM + ' tag: ' + cp.tagName + ' children: ' + cp.children.length);
            if (!cpInDOM) {
              var appEl2 = document.getElementById('app');
              if (appEl2) {
                appEl2.appendChild(cp);
                window.__log.push('[ATTACH] canvas parent attached to #app');
              } else {
                document.body.appendChild(cp);
                window.__log.push('[ATTACH] canvas parent attached to body');
              }
            }
          } else {
            window.__log.push('[ATTACH] no canvasParent found');
          }
          setTimeout(function() {
            window.__log.push('[CHECK] canvas: ' + document.querySelectorAll('canvas').length + ' | body children: ' + document.body.children.length + ' | app children: ' + (document.getElementById('app') ? document.getElementById('app').children.length : -1) + ' | errors: ' + (window.__errors ? window.__errors.length : 'n/a'));
          }, 5000);
        } else {
          window.__log.push('[WAIT] lime not ready, retrying...');
          setTimeout(startGame, 100);
        }
      } catch(e) {
        window.__log.push('[ERROR] ' + e.message + ' | stack: ' + (e.stack||'').substring(0, 500));
      }
    }
    startGame();
  </script>

<script id="cc-mobile-js">(function(){
  // 兜底：拦掉页面拖动/回弹，但【放行弹层内部滚动】——存档/确认框里的内容是可能超出屏幕的
  var SCROLLABLE=["saveSlotOverlay","confirmOverlay","errOverlay","updatePopupOverlay"];
  function inOverlay(t){while(t&&t.nodeType===1){if(t.id&&SCROLLABLE.indexOf(t.id)>=0)return true;t=t.parentNode;}return false;}
  document.addEventListener("touchmove",function(e){if(inOverlay(e.target))return;if(e.cancelable)e.preventDefault();},{passive:false});
  document.addEventListener("contextmenu",function(e){e.preventDefault();},false);
  document.addEventListener("selectstart",function(e){e.preventDefault();},false);
  document.addEventListener("gesturestart",function(e){e.preventDefault();},false);
  function kick(){try{window.dispatchEvent(new Event("resize"));}catch(e){}}
  window.addEventListener("load",function(){kick();setTimeout(kick,300);setTimeout(kick,1200);setTimeout(kick,3000);});
  window.addEventListener("orientationchange",function(){setTimeout(kick,400);setTimeout(kick,1200);});
})();</script>

<script id="cc-cheat-js">(function(){function boot(){
var box=document.getElementById("cc-cheat");if(!box)return;var C=window.__cheat;
var chips=box.querySelectorAll(".ch");
function sync(){for(var i=0;i<chips.length;i++){var k=chips[i].getAttribute("data-k");
chips[i].className="ch"+(C.on[k]?" on":"");}}
for(var i=0;i<chips.length;i++){(function(el){el.onclick=function(e){e.stopPropagation();
var k=el.getAttribute("data-k");C.on[k]=!C.on[k];sync();};})(chips[i]);}
var KEY="__ccCheatUI",lastPos=null;
function loadS(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};}}
function saveS(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function clamp(x,y,w,h){x=Math.max(-w*0.4,Math.min(window.innerWidth-w*0.6,x));
y=Math.max(0,Math.min(window.innerHeight-40,y));return[x,y];}
function place(x,y){box.style.left=x+"px";box.style.top=y+"px";box.style.right="auto";box.style.bottom="auto";}
function savePos(){var r=box.getBoundingClientRect();lastPos={x:r.left,y:r.top};saveS({x:r.left,y:r.top,hidden:false});}
function setHidden(on,silent){
var st=loadS();
if(on){var r=box.getBoundingClientRect();
var bx=(st.x!=null)?st.x:r.left,by=(st.y!=null)?st.y:r.top;
lastPos={x:bx,y:by};var leftEdge=(bx+box.offsetWidth/2<window.innerWidth/2);
box.className="hide";box.style.top=Math.max(0,Math.min(window.innerHeight-72,by))+"px";
if(leftEdge){box.style.left="-12px";box.style.right="auto";box.style.borderRadius="0 12px 12px 0";}
else{box.style.right="-12px";box.style.left="auto";box.style.borderRadius="12px 0 0 12px";}
if(!silent)saveS({x:bx,y:by,hidden:true});}
else{box.className="";box.style.borderRadius="";
var x=(lastPos&&lastPos.x!=null)?lastPos.x:(st.x!=null?st.x:window.innerWidth-box.offsetWidth-8);
var y=(lastPos&&lastPos.y!=null)?lastPos.y:(st.y!=null?st.y:window.innerHeight-box.offsetHeight-8);
var p=clamp(x,y,box.offsetWidth,box.offsetHeight);place(p[0],p[1]);if(!silent)savePos();}}
function restore(){var s=loadS();if(s.hidden){setHidden(true,true);return;}if(s.x!=null){lastPos={x:s.x,y:s.y};var p=clamp(s.x,s.y,box.offsetWidth,box.offsetHeight);place(p[0],p[1]);}}
var drag=null,hd=box.querySelector(".hd");
hd.addEventListener("pointerdown",function(e){if(box.className.indexOf("hide")>=0)return;
if(e.target&&e.target.tagName==="B")return;var r=box.getBoundingClientRect();
drag={dx:e.clientX-r.left,dy:e.clientY-r.top};e.preventDefault();});
window.addEventListener("pointermove",function(e){if(!drag)return;
var x=e.clientX-drag.dx,y=e.clientY-drag.dy;var p=clamp(x,y,box.offsetWidth,box.offsetHeight);place(p[0],p[1]);});
window.addEventListener("pointerup",function(e){if(!drag)return;drag=null;
var r=box.getBoundingClientRect();var x=(r.left+r.width/2<window.innerWidth/2)?8:Math.max(8,window.innerWidth-r.width-8);
var y=Math.max(4,Math.min(window.innerHeight-r.height-4,r.top));place(x,y);savePos();});
box.querySelector(".grip").onclick=function(e){e.stopPropagation();setHidden(false);};
document.getElementById("cc-cheat-h").onclick=function(e){e.stopPropagation();
setHidden(box.className.indexOf("hide")<0);};
document.getElementById("cc-cheat-t").onclick=function(e){e.stopPropagation();
var m=box.className.indexOf("min")>=0;box.className=m?"":"min";
document.getElementById("cc-cheat-t").textContent=m?"收起":"展开";savePos();};
window.addEventListener("resize",function(){if(box.className.indexOf("hide")>=0){box.style.top=Math.max(0,Math.min(window.innerHeight-72,box.getBoundingClientRect().top))+"px";return;}
if(!box.style.left)return;var r=box.getBoundingClientRect();
var p=clamp(Math.max(0,r.left),r.top,box.offsetWidth,box.offsetHeight);place(p[0],p[1]);});
sync();restore();setTimeout(function(){box.style.opacity=".4";},8000);
box.onmouseenter=function(){box.style.opacity="1";};box.ontouchstart=function(){box.style.opacity="1";};}
if(document.readyState==="complete"||document.readyState==="interactive")setTimeout(boot,1200);
else window.addEventListener("DOMContentLoaded",function(){setTimeout(boot,1200);});})();</script>
