<!doctype html><html lang="zh"><meta charset="utf-8"><base href="/"><title>地图几何检查</title><style>body{background:#182628;color:#fff;font:14px sans-serif}button,select{font:inherit}#maps{display:grid;grid-template-columns:repeat(3,1fr)}canvas{width:100%;background:#9fe5f3}figure{margin:4px}figcaption{height:20px}</style><button id="run">检查全部 25 张地图</button><select id="color"><option value="native">原阵营</option><option>Green</option><option>Red</option><option>Blue</option><option>Purple</option></select><output id="status"></output><div id="maps"></div><script src="/game-data.js"></script><script>
window.NativeMaps={};let running=false;document.querySelector('#run').onclick=async()=>{if(running)return;running=true;const maps=document.querySelector('#maps'),status=document.querySelector('#status');maps.replaceChildren();let done=0;for(const data of GAME_DATA.levels){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=600;canvas.height=396;figure.append(canvas,caption);maps.append(figure);try{if(!NativeMaps[data.level]){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='/assets/takeover/maps/level-'+data.level+'.js';s.onload=resolve;s.onerror=reject;document.head.append(s)});while(!NativeMaps[data.level])await new Promise(r=>setTimeout(r,10));}const ctx=canvas.getContext('2d'),scale=.6*Math.min(960/880,600/620);ctx.fillStyle='#9fe5f3';ctx.fillRect(0,0,600,396);ctx.transform(scale,0,0,scale,300-400*scale,12+20*scale);const faction=document.querySelector('#color').value,colors={Red:0,Green:1,Blue:2,Purple:3};const owners=Object.fromEntries(data.nodes.filter(n=>/Node(Castle|Town|MageTower|Camp)(Green|Red|Blue|Purple)Class/.test(n.markerClass)).map(n=>[n.locationNum,colors[faction==='native'?n.markerClass.match(/(Green|Red|Blue|Purple)Class/)[1]:faction]]));const start=performance.now();NativeMaps[data.level].draw(canvas,owners);caption.textContent='Level '+data.level+' · '+Math.round(performance.now()-start)+' ms';done++;}catch(e){caption.textContent='Level '+data.level+' ERROR '+e.message;}status.textContent=done+' / '+GAME_DATA.levels.length+' 张通过';}running=false;};
</script></html>
